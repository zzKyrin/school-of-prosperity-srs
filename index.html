
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School of Prosperity | SRS</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>School of Prosperity</h1>
        <p>Student Records System</p>
    </header>

    <main>
        <section class="login-card">

            <h2>Welcome Back</h2>
            <p>Please sign in to access your account.</p>

            <form>
                <label for="userID">Student or Staff ID</label>
                <input
                    type="text"
                    id="userID"
                    placeholder="Enter your ID"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="button">
                    Sign In
                </button>
            </form>

        </section>
    </main>

    <footer>
        School of Prosperity | Student Records System
    </footer>

</body>
</html>
